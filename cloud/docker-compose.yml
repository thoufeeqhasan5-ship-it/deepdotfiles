name: deepdotfiles-cloud
services:
  n8n:
    build: ../docker
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - NODES_EXCLUDE=[]
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_LOG_LEVEL=warn
    volumes:
      - n8n_data:/home/node/.n8n
      - ../files:/files
      - ./run:/cloudrun
  piper:
    build: ../docker/piper
    environment:
      - PIPER_VOICE=en_US-ryan-high
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
  voice:            # Chatterbox narrator (falls back to Kokoro)
    build: ../voice
    environment:
      - KOKORO_URL=http://kokoro:8880/dev/captioned_speech
      - REF_VOICE=           # empty = Chatterbox's own natural voice
      - EXAGGERATION=0.5     # 0.5 natural, 0.7 more dramatic
      - CFG_WEIGHT=0.5
    volumes:
      - ../files:/files      # put a 10-20 s recording at files/assets/narrator.wav to use that voice
  remotion:         # animated edit (falls back to the ffmpeg edit)
    build: ../remotion
    volumes:
      - ../files:/files
volumes:
  n8n_data:
