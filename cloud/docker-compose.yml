name: deepdotfiles-cloud
services:
  n8n:
    build: ../docker
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - NODES_EXCLUDE=[]
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_LOG_LEVEL=warn
    volumes:
      - n8n_data:/home/node/.n8n
      - ../files:/files
      - ./run:/cloudrun
  piper:
    build: ../docker/piper
    environment:
      - PIPER_VOICE=en_US-ryan-high
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
  voice:            # narrator - choose the voice here (run the "Voice test" on GitHub to hear them)
    build: ../voice
    environment:
      - VOICE=${VOICE:-edge:en-US-BrianNeural}               # space + technology (voice test #3)
      - VOICE_NATURE=${VOICE_NATURE:-edge:en-GB-SoniaNeural}  # ocean + nature (voice test #6)
      - FOCUS=${FOCUS:-}
      - PACE=${PACE:-0.9}                 # 1.0 normal speed, 0.9 = 10% slower
      - GEMINI_KEY=${GEMINI_KEY:-}
      - KOKORO_URL=http://kokoro:8880/dev/captioned_speech
    ports:
      - "8881:8880"
    volumes:
      - ../files:/files
  remotion:         # animated edit (falls back to the ffmpeg edit)
    build: ../remotion
    volumes:
      - ../files:/files
volumes:
  n8n_data:
