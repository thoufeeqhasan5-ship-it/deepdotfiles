name: Deep Dot Files videos

on:
  schedule:
    # One video per run, timed for a global audience (GitHub times are UTC and often start late).
    - cron: "40 11 * * *"   # ~12:00 UTC = 5:30 PM India, 1 PM Europe, 8 AM US East   -> SPACE
    - cron: "40 16 * * *"   # ~17:00 UTC = 10:30 PM India, 6 PM Europe, 1 PM US East  -> OCEAN / NATURE
    - cron: "40 22 * * *"   # ~23:00 UTC = 4:30 AM India, 7 PM US East, 4 PM US West   -> TECHNOLOGY
  workflow_dispatch:
    inputs:
      slot:
        description: "Which kind of story?"
        type: choice
        options: ["SPACE", "the OCEAN or NATURE", "TECHNOLOGY"]
        default: "SPACE"
      publish:
        description: "Post to YouTube, Instagram and Facebook? (No = only make the video)"
        type: boolean
        default: false

permissions:
  contents: write   # lets the run save files/history.json (stories already posted)

concurrency:
  group: deepdotfiles
  cancel-in-progress: false

jobs:
  make-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
      SCRIPT_WORDS: "60-75"   # spoken words per video: 60-75 = about 30-35 s; 90-110 = about 45-50 s (max for Reels: 90 s)
      FOCUS: ${{ github.event.schedule == '40 11 * * *' && 'SPACE' || github.event.schedule == '40 16 * * *' && 'the OCEAN or NATURE' || github.event.schedule == '40 22 * * *' && 'TECHNOLOGY' || inputs.slot }}
    steps:
      - uses: actions/checkout@v4

      - name: Make (and post) the video
        env:
          N8N_CREDENTIALS: ${{ secrets.N8N_CREDENTIALS }}
        run: bash cloud/run.sh

      - name: Remember the story
        if: success() && env.PUBLISH == 'true'
        run: |
          git config user.name "deepdotfiles-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/history.json 2>/dev/null || exit 0
          git commit -m "Story history" || exit 0
          git pull --rebase && git push

      - name: Keep the video for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            files/out/*.mp4
            files/work/log_*.txt
          retention-days: 7
          if-no-files-found: ignore
